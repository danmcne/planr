{% extends "base.html" %}
{% block title %}Day — planr{% endblock %}

{% block content %}
<div class="toolbar">
  <div class="date-nav">
    <button class="btn-nav" id="btn-prev" aria-label="Previous day">‹</button>
    <span class="date-nav-title" id="day-label"></span>
    <button class="btn-nav" id="btn-next" aria-label="Next day">›</button>
    <button class="btn-today" id="btn-today">Today</button>
  </div>
  <span class="toolbar-spacer"></span>
  <button class="btn btn-secondary btn-sm" id="btn-add-event">+ Event</button>
  <button class="btn btn-primary   btn-sm" id="btn-add-task">+ Task</button>
</div>

<div class="split">

  <!-- LEFT: calendar column -->
  <div class="split-l">
    <div class="allday-strip" id="allday-strip"></div>
    <div class="grid-scroll">
      <div class="time-grid" id="time-grid"></div>
    </div>
  </div>

  <!-- RIGHT: task column -->
  <div class="split-r">
    <div class="toolbar" style="padding:7px 14px;">
      <span style="font-size:11px;color:var(--t2);font-weight:600;">TASKS</span>
      <span class="toolbar-spacer"></span>
      <div class="chips" id="effort-chips">
        <span class="chip on" data-effort="">All</span>
        <span class="chip" data-effort="low">Low</span>
        <span class="chip" data-effort="medium">Medium</span>
        <span class="chip" data-effort="high">High</span>
      </div>
    </div>
    <div class="task-list" id="task-list"></div>
  </div>

</div>
{% endblock %}

{% block scripts %}
<script type="module" src="/static/js/day.js?v=6"></script>
{% endblock %}
