{% extends "base.html" %}
{% block title %}Calendar — planr{% endblock %}

{% block content %}
<div class="toolbar">
  <div class="view-tabs" id="view-tabs" role="tablist">
    <button class="view-tab" data-view="day"   role="tab">Day</button>
    <button class="view-tab" data-view="week"  role="tab">Week</button>
    <button class="view-tab" data-view="month" role="tab">Month</button>
  </div>
  <div class="date-nav">
    <button class="btn-nav" id="btn-prev" aria-label="Previous">‹</button>
    <span class="date-nav-title" id="cal-label"></span>
    <button class="btn-nav" id="btn-next" aria-label="Next">›</button>
    <button class="btn-today" id="btn-today">Today</button>
  </div>
  <span class="toolbar-spacer"></span>
  <button class="btn btn-secondary btn-sm" id="btn-add-event">+ Event</button>
  <button class="btn btn-primary   btn-sm" id="btn-add-task">+ Task</button>
</div>

<!-- ── DAY view ──────────────────────────────────────────────── -->
<div class="cal-view split hidden" id="view-day">
  <div class="split-l">
    <div class="allday-strip" id="day-allday"></div>
    <div class="grid-scroll">
      <div class="time-grid" id="day-grid"></div>
    </div>
  </div>
  <div class="split-r">
    <div class="toolbar" style="padding:7px 14px;">
      <span style="font-size:11px;color:var(--t2);font-weight:600;">TASKS</span>
      <span class="toolbar-spacer"></span>
      <div class="chips" id="effort-chips">
        <span class="chip on" data-effort="">All</span>
        <span class="chip" data-effort="low">Low</span>
        <span class="chip" data-effort="medium">Medium</span>
        <span class="chip" data-effort="high">High</span>
      </div>
    </div>
    <div class="task-list" id="day-tasks"></div>
  </div>
</div>

<!-- ── WEEK view ─────────────────────────────────────────────── -->
<div class="cal-view week-outer hidden" id="view-week">
  <div class="week-header-row" id="week-header">
    <div class="week-header-col"></div><!-- time gutter spacer -->
  </div>
  <div class="week-allday-row" id="week-allday">
    <div class="week-allday-gutter"></div>
    <div class="week-allday-lanes" id="week-allday-lanes"></div>
  </div>
  <div class="week-body" id="week-body">
    <div class="week-time-col" id="week-time-col"></div>
    <!-- 7 day columns added by JS -->
  </div>
</div>

<!-- ── MONTH view ────────────────────────────────────────────── -->
<div class="cal-view month-outer hidden" id="view-month">
  <div class="month-dow-row">
    <div class="month-dow">Mon</div><div class="month-dow">Tue</div>
    <div class="month-dow">Wed</div><div class="month-dow">Thu</div>
    <div class="month-dow">Fri</div><div class="month-dow">Sat</div>
    <div class="month-dow">Sun</div>
  </div>
  <div class="month-body" id="month-body"></div>
</div>
{% endblock %}

{% block scripts %}
<script type="module" src="/static/js/calendar.js"></script>
{% endblock %}
