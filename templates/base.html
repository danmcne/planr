<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}planr{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=6">
  {% block head %}{% endblock %}
</head>
<body>
<div id="app">

  <header class="topbar">
    <a href="/day" class="logo">planr</a>
    <div class="capture-wrap">
      <input id="quick-capture" type="text" autocomplete="off" spellcheck="false"
             placeholder="Quick capture… +context !importance ~effort ^due #tag  › prefix with > for event">
    </div>
    <div class="root-filter" id="root-filter" title="Filter all views by root context"></div>
    <button class="btn-icon" id="btn-transfer" title="Import / Export">⇅</button>
    <span class="topbar-clock" id="topbar-clock"></span>
  </header>

  <nav class="nav">
    <div class="nav-group">
      <a href="/day"   class="nav-link">Day</a>
      <a href="/week"  class="nav-link">Week</a>
      <a href="/month" class="nav-link">Month</a>
    </div>
    <span class="nav-sep"></span>
    <div class="nav-group">
      <a href="/tasks"   class="nav-link">Tasks</a>
      <a href="/journal" class="nav-link">Journal</a>
      <a href="/notes"   class="nav-link">Notes</a>
    </div>
    <span class="nav-sep"></span>
    <div class="nav-group">
      <a href="/review"   class="nav-link">Review</a>
      <a href="/search"   class="nav-link">Search</a>
      <a href="/contexts" class="nav-link">Contexts</a>
    </div>
  </nav>

  <main class="main" id="main">
    {% block content %}{% endblock %}
  </main>

</div>

<!-- Toast -->
<div id="toasts"></div>

<!-- Modal -->
<div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-hd">
      <span class="modal-title" id="modal-title"></span>
      <button class="modal-x" id="modal-x" aria-label="Close">✕</button>
    </div>
    <div class="modal-bd" id="modal-bd"></div>
  </div>
</div>

<!-- Wiki-link autocomplete dropdown -->
<div id="ac-drop" class="ac-drop hidden"></div>

<script type="module" src="/static/js/shared.js?v=6"></script>
{% block scripts %}{% endblock %}
</body>
</html>
