{% extends "base.html" %}
{% block title %}Notes — planr{% endblock %}

{% block content %}
<div class="with-sidebar" style="flex:1;overflow:hidden;">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-hd">
      <input id="note-search" type="search" placeholder="Filter…"
             style="flex:1;font-size:11px;height:26px;padding:2px 7px;">
      <button class="btn btn-primary btn-sm" id="btn-new" style="margin-left:6px;">+</button>
    </div>
    <div class="sidebar-list" id="note-list"></div>
  </div>

  <!-- Editor -->
  <div class="editor" id="editor-panel">
    <div class="note-tabs" id="note-tabs"></div>
    <div class="editor-hd">
      <input class="editor-title-inp" id="editor-title" placeholder="Note title">
      <div class="editor-meta-row">
        <div class="editor-meta-item">
          <span style="font-size:10px;color:var(--t3);">Context</span>
          <select id="editor-ctx" style="font-size:11px;padding:2px 6px;"></select>
        </div>
        <div class="editor-meta-item">
          <span class="autosave-badge" id="save-badge"></span>
        </div>
        <div class="editor-meta-item" style="margin-left:auto;">
          <button class="btn btn-danger btn-sm" id="btn-delete">Delete</button>
        </div>
      </div>
    </div>
    <div class="editor-body">
      <textarea class="editor-ta" id="editor-ta"
        placeholder="Write a note… link with [[task:Title]], tag with #topic"></textarea>
    </div>
    <div class="links-panel" id="links-panel"></div>
  </div>

</div>
{% endblock %}

{% block scripts %}
<script type="module" src="/static/js/notes.js"></script>
{% endblock %}
